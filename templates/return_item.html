<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CampusShare | Return Item</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f7f5fc;
            color: #222;
        }

        .navbar {
            background: white;
            padding: 16px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 3px 15px rgba(0,0,0,.08);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: bold;
        }

        .logo-box {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg,#5b4be7,#a044ff);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .home-btn {
            border: none;
            background: #eee9ff;
            color: #6c2bd9;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: 60px auto;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,.08);
        }

        .icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 25px;
            border-radius: 22px;
            background: #eee9ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
        }

        h1 {
            font-size: 30px;
            margin-bottom: 12px;
        }

        .description {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .item-name {
            background: #f7f5fc;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 19px;
            font-weight: bold;
        }

        .return-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg,#5b4be7,#a044ff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .return-btn:hover {
            opacity: .9;
        }

        @media(max-width:600px) {
            .container {
                margin: 30px auto;
            }

            .card {
                padding: 28px 20px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<nav class="navbar">

    <div class="logo">
        <div class="logo-box">CS</div>
        CampusShare
    </div>

    <button class="home-btn"
            onclick="window.location.href='/dashboard'">
        ← Dashboard
    </button>

</nav>


<div class="container">

    <div class="card">

        <div class="icon">
            📦
        </div>

        <h1>Return Item</h1>

        <p class="description">
            Ready to return this borrowed item?
            Confirm the return and the item will become available again.
        </p>

        <div class="item-name">
            {{ item[2] }}
        </div>

        <form method="POST"
              action="/return-item/{{request_id}}">

            <button type="submit" class="return-btn">
                ↩️ Mark Item as Returned
            </button>

        </form>

    </div>

</div>

</body>
</html>
