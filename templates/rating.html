<!DOCTYPE html>
<html>
<head>
    <title>Rate & Review | CampusShare</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            background: white;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        .logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: white;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        h1 {
            color: #222;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        select,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 12px;
            margin-bottom: 22px;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        .rating {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .rating input {
            display: none;
        }

        .rating label {
            font-size: 38px;
            color: #ccc;
            cursor: pointer;
            transition: 0.2s;
        }

        .rating input:checked ~ label {
            color: #ccc;
        }

        .rating label:hover,
        .rating label:hover ~ label {
            color: #ffc107;
        }

        .submit-btn {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 14px;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #6a11cb;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">CS</div>

    <h1>Rate & Review ⭐</h1>

    <p class="subtitle">
        Share your experience with the CampusShare community.
    </p>

    <form method="POST" action="/submit-rating/{{ request_id }}">

        <label>Your Rating</label>

        <select name="rating" required>
            <option value="">Select rating</option>
            <option value="5">⭐⭐⭐⭐⭐ — Excellent</option>
            <option value="4">⭐⭐⭐⭐ — Very Good</option>
            <option value="3">⭐⭐⭐ — Good</option>
            <option value="2">⭐⭐ — Average</option>
            <option value="1">⭐ — Poor</option>
        </select>

        <label>Your Review</label>

        <textarea
            name="review"
            placeholder="Write your experience..."
            required></textarea>

        <button type="submit" class="submit-btn">
            Submit Review
        </button>

    </form>

    <a href="/my-requests" class="back">
        ← Back to My Requests
    </a>

</div>

</body>
</html>
