<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusShare Admin Panel</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f0ff;
            margin: 0;
            padding: 25px;
        }

        h1 {
            color: #6d28d9;
        }

        .panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #6d28d9;
            color: white;
        }

        .admin {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>CampusShare Admin Panel</h1>
    <p>Manage registered users.</p>

    <div class="panel">
        <h2>Registered Users</h2>

        <table>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Role</th>
            </tr>

            {% for user in users %}
            <tr>
                <td>{{ user[0] }}</td>
                <td>{{ user[1] }}</td>
                <td>{{ user[2] }}</td>
                <td>{{ user[3] }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
